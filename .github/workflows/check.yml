name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: travel_agent
          POSTGRES_DB: travel_agent
          # 仅用于此CI作业内的临时服务，不是任何开发/生产凭据。
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel_agent -d travel_agent"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_USER: travel_agent
      POSTGRES_DB: travel_agent
      POSTGRES_PASSWORD: ci-ephemeral-only
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 匹配本地已验证的CLI，避免SDK回归因缺CLI被跳过；不配置任何模型凭据。
      - run: npm install --global @anthropic-ai/claude-code@2.1.295
      - run: claude --version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/dev.py check
      - run: uv run python scripts/dev.py test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm run typecheck && pnpm run lint && pnpm run test && pnpm run build
        working-directory: apps/web
  docker-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python scripts/dev.py stack-up
      - run: uv run python -m scripts.smoke_demo
      - run: uv run python scripts/dev.py stack-down
      - run: uv run python scripts/dev.py stack-up
      - run: uv run python -m scripts.smoke_demo --verify
      - if: always()
        run: uv run python scripts/dev.py stack-down
